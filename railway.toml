[build]
builder = "NIXPACKS"
# Override Nixpacks' auto-detected Next.js build. We wipe the compiled
# output before each build to defeat stale build artefacts. We leave
# apps/web/.next/cache alone because Railway mounts a build cache there
# (bind mount makes it "device busy"), and cache contents never affect
# the compiled server bundle.
buildCommand = "rm -rf apps/web/.next/server apps/web/.next/static apps/web/.next/standalone apps/web/.next/types && cd apps/web && npm run build"

[deploy]
startCommand = "npm run start --workspace=apps/web"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway sets $PORT to 8080 by default; Next.js must bind to it.
[env]
PORT = "8080"
