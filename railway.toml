[build]
builder = "NIXPACKS"
# Override Nixpacks' auto-detected Next.js build. We wipe the compiled
# output and the build cache before each build to defeat stale route
# manifests. The bind-mounted .next/cache was causing the server to
# serve a cached static 404 page for newly added API routes.
buildCommand = "rm -rf apps/web/.next && cd apps/web && npm run build"

[deploy]
startCommand = "npm run start --workspace=apps/web"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway sets $PORT to 8080 by default; Next.js must bind to it.
[env]
PORT = "8080"
