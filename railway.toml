[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd apps/web && npm run build && npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway sets $PORT to 8080 by default; Next.js must bind to it.
[env]
PORT = "8080"
